// ── Login ─────────────────────────────────────────────────────────────────────
function LoginPage({ onLogin, setAuthPage }) {
  const [step, setStep] = React.useState(1); // 1=phone, 2=otp
  const [phone, setPhone] = React.useState('');
  const [digits, setDigits] = React.useState(['','','','','','']);
  const [showPwd, setShowPwd] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const [seconds, setSeconds] = React.useState(120);
  const otpRefs = React.useRef([]);

  React.useEffect(()=>{
    if(step!==2) return;
    setSeconds(120);
    const t = setInterval(()=>setSeconds(s=>s>0?s-1:0), 1000);
    return ()=>clearInterval(t);
  },[step]);

  const inp = (err) => ({ width:'100%', background:'white', border:`1.5px solid ${err?'#DC2626':'#E9ECEF'}`, borderRadius:10, padding:'11px 14px', fontSize:14, fontFamily:"'DM Sans',sans-serif", color:'#1a1a2e', outline:'none' });
  const primaryBtn = (dis) => ({ width:'100%', background: dis ? '#CBD5E1' : '#F39C12', color: dis ? '#94A3B8' : '#1a1a2e', fontSize:15, fontWeight:700, padding:'13px', borderRadius:12, border:'none', cursor: dis ? 'not-allowed' : 'pointer', fontFamily:"'DM Sans',sans-serif", boxShadow: dis ? 'none' : '0 4px 16px rgba(243,156,18,.25)', transition:'all 150ms' });

  const submitPhone = (e) => {
    e.preventDefault(); setError('');
    // Accept both "0782693724" (with leading 0) and "782693724" (without, as typed after +250 prefix)
    if (!phone.match(/^0?7\d{8}$/)) { setError('Enter a valid Rwandan phone (e.g. 782693724)'); return; }
    setLoading(true); setTimeout(()=>{ setLoading(false); setStep(2); }, 900);
  };

  const handleDigit = (i, val) => {
    const clean = val.replace(/\D/g,'').slice(-1);
    const next = [...digits]; next[i] = clean; setDigits(next);
    if(clean && i<5) otpRefs.current[i+1]?.focus();
    if(!clean && i>0) otpRefs.current[i-1]?.focus();
  };
  const handleDigitKey = (i, e) => {
    if(e.key==='Backspace' && !digits[i] && i>0) { otpRefs.current[i-1]?.focus(); }
  };

  const code = digits.join('');
  const submitOTP = (e) => {
    e.preventDefault(); setError('');
    setLoading(true);
    setTimeout(()=>{
      setLoading(false);
      if(code==='123456'){ onLogin(); } else { setError('Invalid OTP. Use 123456 for this demo.'); }
    }, 900);
  };

  const mm = String(Math.floor(seconds/60)).padStart(2,'0');
  const ss = String(seconds%60).padStart(2,'0');

  return (
    <AuthShell>
      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:'#1a1a2e', marginBottom:4 }}>
        {step===1 ? 'Welcome back' : 'Verify your phone'}
      </div>
      <div style={{ fontSize:14, color:'#888', marginBottom:32 }}>
        {step===1 ? 'Sign in to your SmartShine account' : `We sent a code to +250 ${phone.slice(1)}`}
      </div>

      {/* Step dots */}
      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:28 }}>
        {[1,2].map((s,i)=>(
          <React.Fragment key={s}>
            <div style={{ width:26, height:26, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, background:step>=s?'#1A5276':'#E9ECEF', color:step>=s?'white':'#aaa', transition:'all 200ms' }}>
              {step>s ? <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg> : s}
            </div>
            {i<1&&<div style={{ flex:1, height:2, background:step>=2?'#1A5276':'#E9ECEF', transition:'background 200ms' }}></div>}
          </React.Fragment>
        ))}
      </div>

      {error && <div style={{ background:'#FEE2E2', border:'1px solid #FECACA', color:'#B91C1C', fontSize:13, borderRadius:10, padding:'10px 14px', marginBottom:16 }}>{error}</div>}

      {step===1 ? (
        <form onSubmit={submitPhone} style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <div>
            <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e', display:'block', marginBottom:6 }}>Phone Number</label>
            <div style={{ display:'flex', gap:0 }}>
              <div style={{ background:'white', border:'1.5px solid #E9ECEF', borderRight:'none', borderRadius:'10px 0 0 10px', padding:'11px 12px', display:'flex', alignItems:'center', gap:6, flexShrink:0 }}>
                <span style={{ fontSize:16 }}>🇷🇼</span>
                <span style={{ fontSize:14, fontWeight:600, color:'#1a1a2e' }}>+250</span>
              </div>
              <input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="782693724"
                style={{ ...inp(!!error), borderRadius:'0 10px 10px 0', flex:1 }} required autoFocus />
            </div>
          </div>
          <div>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
              <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e' }}>Password <span style={{ fontSize:11, color:'#888', fontWeight:400 }}>(optional)</span></label>
            </div>
            <div style={{ position:'relative' }}>
              <input type={showPwd?'text':'password'} placeholder="••••••••"
                style={{ ...inp(false), paddingRight:44 }} />
              <button type="button" onClick={()=>setShowPwd(v=>!v)} style={{ position:'absolute', right:12, top:'50%', transform:'translateY(-50%)', background:'none', border:'none', cursor:'pointer', color:'#888', padding:0 }}>
                {showPwd ? <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                  : <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>}
              </button>
            </div>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ flex:1, height:1, background:'#E9ECEF' }}></div>
            <span style={{ fontSize:12, color:'#aaa' }}>or sign in with OTP</span>
            <div style={{ flex:1, height:1, background:'#E9ECEF' }}></div>
          </div>
          <button type="submit" style={primaryBtn(loading)} disabled={loading}>
            {loading ? 'Sending OTP…' : 'Send OTP →'}
          </button>
          <p style={{ textAlign:'center', fontSize:13, color:'#888', margin:0 }}>
            No account?{' '}
            <span onClick={()=>setAuthPage('register')} style={{ color:'#2E86C1', cursor:'pointer', fontWeight:600 }}>Create one →</span>
          </p>
        </form>
      ) : (
        <form onSubmit={submitOTP} style={{ display:'flex', flexDirection:'column', gap:20 }}>
          <div>
            <p style={{ fontSize:13, color:'#555', margin:'0 0 16px' }}>
              Code sent to <strong>+250 {phone.slice(1)}</strong>.{' '}
              <button type="button" onClick={()=>{setStep(1);setDigits(['','','','','','']);setError('');}} style={{ color:'#2E86C1', background:'none', border:'none', cursor:'pointer', fontSize:13, fontFamily:"'DM Sans',sans-serif" }}>Change</button>
            </p>
            <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e', display:'block', marginBottom:10 }}>Enter 6-digit code</label>
            {/* 6 individual boxes */}
            <div style={{ display:'flex', gap:6 }}>
              {digits.map((d,i)=>(
                <input key={i} ref={el=>otpRefs.current[i]=el}
                  type="text" inputMode="numeric" maxLength={1} value={d}
                  onChange={e=>handleDigit(i,e.target.value)}
                  onKeyDown={e=>handleDigitKey(i,e)}
                  style={{ flex:'0 0 calc((100% - 30px) / 6)', width:0, minWidth:0, height:54, borderRadius:10, border:`2px solid ${d?'#2E86C1':'#E9ECEF'}`, background: d?'#EFF6FF':'white', fontSize:20, fontWeight:700, fontFamily:'monospace', textAlign:'center', color:'#1A5276', outline:'none', transition:'all 150ms' }}
                />
              ))}
            </div>
          </div>

          {/* Dev mode info box */}
          <div style={{ background:'#FEF9EE', border:'1px solid #FDE68A', borderRadius:12, padding:'12px 14px', fontSize:12, color:'#92400E' }}>
            <div style={{ fontWeight:700, marginBottom:3 }}>Development Mode</div>
            <div>Check the Django terminal for the OTP, or use code <strong>123456</strong> in this prototype.</div>
          </div>

          {/* Countdown */}
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', fontSize:13 }}>
            <span style={{ color: seconds>0 ? '#888' : '#2E86C1', cursor: seconds===0 ? 'pointer' : 'default' }}
              onClick={()=>{ if(seconds===0){setDigits(['','','','','','']);setSeconds(120);} }}>
              {seconds>0 ? `Resend in ${mm}:${ss}` : 'Resend OTP'}
            </span>
            <span style={{ color:'#888' }}>{code.length}/6 digits</span>
          </div>

          <button type="submit" style={primaryBtn(loading||code.length!==6)} disabled={loading||code.length!==6}>
            {loading ? 'Verifying…' : 'Verify & Sign In'}
          </button>
        </form>
      )}
    </AuthShell>
  );
}

// ── Registration ──────────────────────────────────────────────────────────────
function RegisterPage({ setAuthPage, onLogin }) {
  const [form, setForm] = React.useState({ fullName:'', phone:'', email:'', password:'' });
  const [showPwd, setShowPwd] = React.useState(false);
  const [loading, setLoading] = React.useState(false);
  const [error, setError] = React.useState('');

  const strength = (pwd) => {
    let s = 0;
    if(pwd.length>=8) s++;
    if(/[A-Z]/.test(pwd)) s++;
    if(/[0-9]/.test(pwd)) s++;
    if(/[^A-Za-z0-9]/.test(pwd)) s++;
    return s;
  };
  const pwdStrength = strength(form.password);
  const strengthLabel = ['','Weak','Fair','Good','Strong'][pwdStrength];
  const strengthColor = ['#E9ECEF','#DC2626','#F59E0B','#2E86C1','#22C55E'][pwdStrength];

  const inp = { width:'100%', background:'white', border:'1.5px solid #E9ECEF', borderRadius:10, padding:'11px 14px', fontSize:14, fontFamily:"'DM Sans',sans-serif", color:'#1a1a2e', outline:'none' };

  const handleSubmit = (e) => {
    e.preventDefault(); setError('');
    if(!form.fullName||!form.phone||!form.password) { setError('Please fill in all required fields'); return; }
    if(!form.phone.match(/^0?7\d{8}$/)) { setError('Enter a valid Rwandan phone number (e.g. 782693724)'); return; }
    if(form.password.length<6) { setError('Password must be at least 6 characters'); return; }
    setLoading(true);
    setTimeout(()=>{ setLoading(false); onLogin(); }, 1100);
  };

  return (
    <AuthShell>
      <div style={{ fontFamily:"'Playfair Display',serif", fontSize:28, fontWeight:700, color:'#1a1a2e', marginBottom:4 }}>Create account</div>
      <div style={{ fontSize:14, color:'#888', marginBottom:32 }}>Join thousands of SmartShine customers in Kigali</div>

      {error && <div style={{ background:'#FEE2E2', border:'1px solid #FECACA', color:'#B91C1C', fontSize:13, borderRadius:10, padding:'10px 14px', marginBottom:16 }}>{error}</div>}

      <form onSubmit={handleSubmit} style={{ display:'flex', flexDirection:'column', gap:14 }}>
        <div>
          <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e', display:'block', marginBottom:6 }}>Full Name <span style={{ color:'#DC2626' }}>*</span></label>
          <input value={form.fullName} onChange={e=>setForm(p=>({...p,fullName:e.target.value}))} placeholder="Jean de la Croix Niyonkuru" style={inp} required autoFocus />
        </div>
        <div>
          <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e', display:'block', marginBottom:6 }}>Phone Number <span style={{ color:'#DC2626' }}>*</span></label>

  pending:     { steps:['Pending','Confirmed','In Progress','Completed'], current:0 },
  confirmed:   { steps:['Pending','Confirmed','In Progress','Completed'], current:1 },
  in_progress: { steps:['Pending','Confirmed','In Progress','Completed'], current:2 },

};

const BOOKING_STATUS_STYLE = {
  pending:     { bg:'#FEF3C7', text:'#92400E' },
  confirmed:   { bg:'#DBEAFE', text:'#1D4ED8' },

function BookingProgressBar({ status }) {
  const cfg = STATUS_STEPS[status] || STATUS_STEPS.pending;
  const col = status==='cancelled' ? '#DC2626' : '#1A5276';
  return (
    <div style={{ marginTop:10 }}>
      <div style={{ display:'flex', alignItems:'center' }}>
        {cfg.steps.map((s,i)=>(
          <React.Fragment key={s}>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
              <div style={{ width:22, height:22, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
                background: i<=cfg.current ? col : '#E9ECEF', transition:'background 200ms' }}>
                {i<cfg.current
                  ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>
                  : <div style={{ width:6, height:6, borderRadius:'50%', background: i===cfg.current ? 'white' : '#ccc' }}></div>}
              </div>
              <span style={{ fontSize:9, color: i<=cfg.current ? col : '#ccc', fontWeight: i===cfg.current ? 700 : 400, whiteSpace:'nowrap' }}>{s}</span>
            </div>
            {i<cfg.steps.length-1 && <div style={{ flex:1, height:2, background: i<cfg.current ? col : '#E9ECEF', margin:'0 4px', marginBottom:14, transition:'background 200ms' }}></div>}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

    </div>
  );

        </div>
      </div>
    </div>

    if (step===1) return true;
    if (step===2) return !!selectedVehicle;
    if (step===3) return !!selectedDate && !!selectedTime;
    return true;
  };

  return (
    <div style={PAGE_WRAP}>
      <div style={{ ...MAIN, maxWidth:560 }}>

        {step===2 && <Step2 />}
        {step===3 && <Step3 />}
        {step===4 && <Step4 />}
        <button
          onClick={() => {
            if (step < 4) { setStep(s=>s+1); }

          {step < 4 ? 'Continue →' : 'Proceed to Payment →'}
        </button>
      </div>
      <Footer />
    </div>
  );
}

    </div>
  );

  return (
    <div style={PAGE_WRAP}>
      <div style={{ ...MAIN, maxWidth:520 }}>
        <button onClick={()=>setPage('branch')} style={{ display:'flex', alignItems:'center', gap:4, color:'#2E86C1', background:'none', border:'none', cursor:'pointer', fontSize:13, fontWeight:500, fontFamily:"'DM Sans',sans-serif", marginBottom:20, padding:0 }}>
          ← Back to services
        </button>
        <h2 style={{ fontFamily:"'Playfair Display',serif", fontSize:24, fontWeight:700, color:'#1a1a2e', marginBottom:20 }}>Complete Payment</h2>

        {/* Order summary */}
        <div style={{ background:'white', borderRadius:16, boxShadow:'0 2px 12px rgba(0,0,0,.04)', padding:20, marginBottom:16 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'#888', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:12 }}>Order Summary</div>
          {[
            ['Service', svc.name],
            ['Branch', brn.name],
            ['Date', dateStr],
            ['Time', timeStr],
            ['Duration', `${svc.duration_minutes} min`],
          ].map(([k,v]) => (
            <div key={k} style={{ display:'flex', justifyContent:'space-between', fontSize:13, padding:'5px 0', borderBottom:'1px solid #F9FAFB' }}>
              <span style={{ color:'#888' }}>{k}</span>
              <span style={{ fontWeight:500, color:'#1a1a2e' }}>{v}</span>
            </div>
          ))}
          <div style={{ display:'flex', justifyContent:'space-between', fontSize:16, fontWeight:800, color:'#1A5276', paddingTop:12, marginTop:4 }}>
            <span>Total</span>
            <span>RWF {Number(svc.price).toLocaleString()}</span>
          </div>
        </div>

        {/* Payment method */}
        <div style={{ background:'white', borderRadius:16, boxShadow:'0 2px 12px rgba(0,0,0,.04)', padding:20, marginBottom:16 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'#888', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:12 }}>Payment Method</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
            {methodBtn('momo', 'MoMo', 'MTN Mobile Money', 'Recommended · Instant')}
            {methodBtn('airtel', 'AT', 'Airtel Money', 'Airtel Rwanda subscribers')}
          </div>
        </div>

        {/* Phone input */}
        <div style={{ background:'white', borderRadius:16, boxShadow:'0 2px 12px rgba(0,0,0,.04)', padding:20, marginBottom:24 }}>
          <div style={{ fontSize:11, fontWeight:600, color:'#888', letterSpacing:'.08em', textTransform:'uppercase', marginBottom:12 }}>
            {method==='momo' ? 'MTN MoMo' : 'Airtel Money'} Phone Number
          </div>
          <label style={{ fontSize:13, fontWeight:500, color:'#1a1a2e', display:'block', marginBottom:6 }}>Phone Number</label>
          <input value={phone} onChange={e=>setPhone(e.target.value)}
            style={{ width:'100%', background:'#fafbfc', border:'1.5px solid #E9ECEF', borderRadius:10, padding:'10px 14px', fontSize:14, fontFamily:"'DM Sans',sans-serif", color:'#1a1a2e', outline:'none' }} />
          <p style={{ fontSize:11, color:'#aaa', marginTop:6 }}>A payment prompt will be sent to this number</p>
        </div>

        {/* Pay button */}
        <button onClick={handlePay} style={{ width:'100%', background:'#F39C12', color:'#1a1a2e', fontSize:16, fontWeight:700, padding:'14px', borderRadius:12, border:'none', cursor:'pointer', fontFamily:"'DM Sans',sans-serif", boxShadow:'0 4px 16px rgba(243,156,18,.25)', transition:'all 150ms' }}>
          Pay RWF {Number(svc.price).toLocaleString()}
        </button>
        <p style={{ textAlign:'center', fontSize:11, color:'#aaa', marginTop:10 }}>
          Secured by MTN MoMo · Payments processed in Rwanda
        </p>
      </div>
      <Footer />
    </div>
  );
}

function App() {
  const [page, setPage] = React.useState('login');
  const [authPage, setAuthPage] = React.useState('login'); // 'login' | 'register'
  const [selectedBranch, setSelectedBranch] = React.useState(null);
  const [selectedService, setSelectedService] = React.useState(null);
  const [bookingDetails, setBookingDetails] = React.useState(null);

  if (page==='login') {
    if (authPage==='register') return <RegisterPage setAuthPage={setAuthPage} onLogin={()=>setPage('home')} />;
    return <LoginPage onLogin={()=>setPage('home')} setAuthPage={setAuthPage} />;
  }
  return (
    <div style={{ display:'flex', flexDirection:'column', minHeight:'100vh' }}>
      <Navbar currentPage={page} setPage={setPage} />
      {page==='home' && <HomePage setPage={setPage} setSelectedBranch={setSelectedBranch} />}
      {page==='branch' && selectedBranch && <BranchDetailPage branch={selectedBranch} setPage={setPage} setSelectedService={setSelectedService} />}
      {page==='booking' && <BookingFlowPage service={selectedService} branch={selectedBranch} setPage={setPage} setBookingDetails={setBookingDetails} />}
      {page==='bookings' && <BookingsPage />}
      {page==='vehicles' && <VehiclesPage />}
      {page==='payment' && <PaymentPage service={selectedService} branch={selectedBranch} bookingDetails={bookingDetails} setPage={setPage} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
